name: Build Blackbox Realtime V6 (ZIP + one secret)

on:
  workflow_dispatch:
  push:
    paths:
      - "BlackboxOffline_REALTIME_FINAL_V6.zip"
      - ".github/workflows/build-from-zip-v6-one-secret.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify input ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "BlackboxOffline_REALTIME_FINAL_V6.zip"
          unzip -t "BlackboxOffline_REALTIME_FINAL_V6.zip" >/dev/null
          echo "ZIP OK"

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "BlackboxOffline_REALTIME_FINAL_V6.zip" -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/wear/build.gradle
          test -f project/llm/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare llama.cpp
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          if [ ! -d llama.cpp ]; then
            git clone --depth 1 --branch b3403 https://github.com/ggerganov/llama.cpp.git llama.cpp
          fi
          test -f llama.cpp/CMakeLists.txt

      - name: Verify realtime Whisper bridge and native build flags
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          grep -R "RealtimeTranscriber" -n app/src/main/java | head
          grep -R "GGML_NATIVE[[:space:]]\+OFF" -n app/src/main/cpp llm/src/main/cpp || true
          test -f app/src/main/cpp/blackbox_ai.cpp

      - name: Compile project
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace compileDebugKotlin compileReleaseKotlin \
            :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac \
            :wear:compileReleaseJavaWithJavac

      - name: Build Phone + Watch release APKs
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease :wear:assembleRelease

      - name: Create release signing key from BLACKBOX secret
        shell: bash
        env:
          BLACKBOX: ${{ secrets.BLACKBOX }}
        run: |
          set -euo pipefail
          test -n "${BLACKBOX:-}" || { echo "BLACKBOX secret is not set"; exit 1; }
          rm -f blackbox_release.jks
          keytool -genkeypair \
            -keystore blackbox_release.jks \
            -storepass "$BLACKBOX" \
            -keypass "$BLACKBOX" \
            -alias blackbox \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Blackbox, OU=Release, O=Blackbox, L=Miami, ST=Florida, C=US"

      - name: Sign and verify Phone + Watch APKs
        shell: bash
        working-directory: project
        env:
          BLACKBOX: ${{ secrets.BLACKBOX }}
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"

          PHONE_IN="$(find app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' | head -n 1)"
          WATCH_IN="$(find wear/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' | head -n 1)"

          test -n "$PHONE_IN"
          test -n "$WATCH_IN"

          mkdir -p ../artifacts
          "$APKSIGNER" sign \
            --ks ../blackbox_release.jks \
            --ks-key-alias blackbox \
            --ks-pass "pass:${BLACKBOX}" \
            --key-pass "pass:${BLACKBOX}" \
            --out ../artifacts/Blackbox-Phone-V6.apk \
            "$PHONE_IN"

          "$APKSIGNER" sign \
            --ks ../blackbox_release.jks \
            --ks-key-alias blackbox \
            --ks-pass "pass:${BLACKBOX}" \
            --key-pass "pass:${BLACKBOX}" \
            --out ../artifacts/Blackbox-Watch-V6.apk \
            "$WATCH_IN"

          "$APKSIGNER" verify --verbose ../artifacts/Blackbox-Phone-V6.apk
          "$APKSIGNER" verify --verbose ../artifacts/Blackbox-Watch-V6.apk

      - name: Upload Phone + Watch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox-Realtime-V6-Phone-and-Watch
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f blackbox_release.jks
