name: Build Blackbox Ecosystem from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'BlackboxOffline_REALTIME_FINAL_V4.zip'
      - '.github/workflows/build-from-zip-v4-one-secret.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'ERROR: sdkmanager was not found.'
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;25.2.9519653' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME='BlackboxOffline_REALTIME_FINAL_V4.zip'
          test -f "$ZIP_NAME"

          rm -rf _project
          mkdir -p _project
          unzip -q -o "$ZIP_NAME" -d _project

          PROJECT_ROOT="$(find _project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo 'ERROR: Android project root was not found in ZIP.'
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. ./
          rm -rf _project

          # Never reuse stale native/Gradle state from another build.
          rm -rf app/.cxx wear/.cxx llm/.cxx .gradle
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'ndk.dir=%s/ndk/25.2.9519653\n' "$ANDROID_HOME" >> local.properties

      - name: Verify realtime bridge and Android native settings
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/java/com/blackbox/offline/RealtimeTranscriber.java
          test -f app/src/main/java/com/blackbox/offline/LocalAiEngine.java
          test -f app/src/main/cpp/blackbox_ai.cpp

          grep -q 'public String transcribeRealtimePcm(float\[\] pcm)' \
            app/src/main/java/com/blackbox/offline/LocalAiEngine.java
          grep -q 'nativeTranscribeRealtimePcm' \
            app/src/main/java/com/blackbox/offline/LocalAiEngine.java
          grep -q 'Java_com_blackbox_offline_LocalAiEngine_nativeTranscribeRealtimePcm' \
            app/src/main/cpp/blackbox_ai.cpp

          # Android builds must not use the host runner's native CPU flags.
          grep -q 'set(GGML_NATIVE OFF CACHE BOOL "" FORCE)' \
            app/src/main/cpp/CMakeLists.txt

          if grep -R --include='*.cmake' --include='CMakeLists.txt' -n -- '-mcpu=native' \
              app/src/main/cpp/third_party/whisper.cpp >/dev/null 2>&1; then
            echo 'WARNING: optional native-CPU text exists in whisper.cpp; GGML_NATIVE is forced OFF for Android.'
          fi

          echo 'Realtime bridge: OK'
          echo 'Android GGML_NATIVE=OFF: OK'

      - name: Fetch pinned llama.cpp b3403
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_DIR='app/src/main/cpp/third_party/llama.cpp'

          if [ ! -f "$LLAMA_DIR/CMakeLists.txt" ]; then
            rm -rf "$LLAMA_DIR"
            git clone --depth 1 --branch b3403 \
              https://github.com/ggml-org/llama.cpp.git "$LLAMA_DIR"
          fi

          test -f "$LLAMA_DIR/CMakeLists.txt"
          test -f "$LLAMA_DIR/include/llama.h"

      - name: Compile Java first
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:compileReleaseJavaWithJavac \
                 :wear:compileReleaseJavaWithJavac \
                 --no-daemon --stacktrace

      - name: Build Phone and Galaxy Watch release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :wear:assembleRelease \
            --no-daemon --stacktrace

      - name: Create signing key from the ONE GitHub Secret
        shell: bash
        env:
          BLACKBOX_PASSWORD: ${{ secrets.BLACKBOX }}
        run: |
          set -euo pipefail

          if [ -z "${BLACKBOX_PASSWORD:-}" ]; then
            echo 'ERROR: GitHub Repository Secret BLACKBOX is missing.'
            echo 'Create exactly one secret named BLACKBOX.'
            exit 1
          fi

          # This is intentionally the same one-secret signing method that has
          # already produced a working APK in the successful build.
          keytool -genkeypair \
            -keystore blackbox_release.jks \
            -storepass:env BLACKBOX_PASSWORD \
            -keypass:env BLACKBOX_PASSWORD \
            -alias blackbox \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Blackbox Offline, O=Blackbox, C=US' \
            >/dev/null 2>&1

          keytool -list \
            -keystore blackbox_release.jks \
            -storepass:env BLACKBOX_PASSWORD \
            -alias blackbox \
            >/dev/null

          echo 'One-secret signing key: OK'

      - name: Sign Phone and Watch APKs
        shell: bash
        env:
          BLACKBOX_PASSWORD: ${{ secrets.BLACKBOX }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p output_apks

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            phone-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks blackbox_release.jks \
            --ks-key-alias blackbox \
            --ks-pass env:BLACKBOX_PASSWORD \
            --key-pass env:BLACKBOX_PASSWORD \
            --out output_apks/BlackboxPhone.apk \
            phone-aligned.apk

          if [ -f wear/build/outputs/apk/release/wear-release-unsigned.apk ]; then
            "$BUILD_TOOLS/zipalign" -f -p 4 \
              wear/build/outputs/apk/release/wear-release-unsigned.apk \
              watch-aligned.apk

            "$BUILD_TOOLS/apksigner" sign \
              --ks blackbox_release.jks \
              --ks-key-alias blackbox \
              --ks-pass env:BLACKBOX_PASSWORD \
              --key-pass env:BLACKBOX_PASSWORD \
              --out output_apks/BlackboxWatch.apk \
              watch-aligned.apk
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose output_apks/BlackboxPhone.apk
          if [ -f output_apks/BlackboxWatch.apk ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose output_apks/BlackboxWatch.apk
          fi

          ls -lh output_apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox-Realtime-Phone-and-Watch
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f blackbox_release.jks phone-aligned.apk watch-aligned.apk
